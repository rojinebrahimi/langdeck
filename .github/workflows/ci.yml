name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: langdeck
          POSTGRES_PASSWORD: langdeck
          POSTGRES_DB: langdeck_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U langdeck" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LANGDECK_TEST_DATABASE_URL: postgres://langdeck:langdeck@localhost:5432/langdeck_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test (race, with PostgreSQL)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ui:
    name: UI (type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  sdk:
    name: Python SDK (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  e2e:
    name: End-to-end (Go server + Python SDK + LangGraph)
    runs-on: ubuntu-latest
    needs: [go, sdk]
    env:
      LANGDECK_BOOTSTRAP_AGENT_KEY: ldk_ci-e2e-key-0000000000000000000000000000
      LANGDECK_ADMIN_FORCE_PASSWORD_CHANGE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: go build -o bin/langdeck ./cmd/langdeck
      - name: Start LangDeck
        run: |
          LANGDECK_LOG_FORMAT=text ./bin/langdeck serve > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
      - run: pip install -e "sdk/python[dev]"
      - name: Run e2e tests
        env:
          LANGDECK_E2E_URL: http://localhost:8080
          LANGDECK_E2E_KEY: ${{ env.LANGDECK_BOOTSTRAP_AGENT_KEY }}
        run: pytest -q sdk/python/tests/test_e2e.py
      - if: failure()
        run: cat server.log

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/langdeck --set auth.oidc.issuer=https://idp.example.com
      - name: Render and validate manifests
        run: |
          helm template t deploy/helm/langdeck \
            --set postgresql.enabled=true --set postgresql.password=ci \
            --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set autoscaling.enabled=true > rendered.yaml
          go run github.com/yannh/kubeconform/cmd/kubeconform@latest -strict -summary \
            -ignore-missing-schemas rendered.yaml

  docker:
    name: Docker build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: langdeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name ld -p 8080:8080 langdeck:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          docker exec ld /langdeck version
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: langdeck:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
