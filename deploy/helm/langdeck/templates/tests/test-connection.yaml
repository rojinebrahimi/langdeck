apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "langdeck.fullname" . }}-test"
  labels: {{- include "langdeck.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: readyz
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "langdeck.fullname" . }}:{{ .Values.service.port }}/readyz"]
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
