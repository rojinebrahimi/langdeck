{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "langdeck.fullname" . }}
  labels: {{- include "langdeck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "langdeck.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: http }]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports: [{ port: metrics }]
      from:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
{{- end }}
