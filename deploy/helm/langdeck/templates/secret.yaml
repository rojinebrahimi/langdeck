{{- if not .Values.existingSecret }}
{{- $dbURL := .Values.secrets.databaseURL }}
{{- if and (not $dbURL) .Values.postgresql.enabled }}
{{- $dbURL = printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.username (required "postgresql.password is required" .Values.postgresql.password) (include "langdeck.fullname" .) .Values.postgresql.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "langdeck.secretName" . }}
  labels: {{- include "langdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $dbURL | quote }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  bootstrap-agent-key: {{ .Values.secrets.bootstrapAgentKey | quote }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | quote }}
  {{- end }}
{{- end }}
