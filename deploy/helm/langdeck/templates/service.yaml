apiVersion: v1
kind: Service
metadata:
  name: {{ include "langdeck.fullname" . }}
  labels: {{- include "langdeck.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "langdeck.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
---
# Metrics get their own ClusterIP service so they are never routed by the ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langdeck.fullname" . }}-metrics
  labels:
    {{- include "langdeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "langdeck.selectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: metrics, protocol: TCP }
