[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langdeck"
version = "0.1.1"
description = "Python SDK for LangDeck, the open-source control plane for LangGraph agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "LangDeck contributors" }]
keywords = ["langgraph", "langchain", "agents", "observability", "control-plane", "llmops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "langgraph>=0.2", "langchain-core>=0.2"]

[project.urls]
Homepage = "https://github.com/rojinebrahimi/langdeck"
Documentation = "https://github.com/rojinebrahimi/langdeck/tree/main/sdk/python"
Source = "https://github.com/rojinebrahimi/langdeck/tree/main/sdk/python"
Issues = "https://github.com/rojinebrahimi/langdeck/issues"
Changelog = "https://github.com/rojinebrahimi/langdeck/blob/main/CHANGELOG.md"
Demo = "https://langdeck-demo.onrender.com"

[tool.hatch.build.targets.wheel]
packages = ["src/langdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP038"] # isinstance(x, (A, B)) is clearer and faster than A | B
