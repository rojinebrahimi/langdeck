version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # int conversions are bounded by validation
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]
formatters:
  enable: [gofmt, goimports]
